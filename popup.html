<!DOCTYPE html>
<html>
  <head>
    <title>Tab Manager</title>
  </head>
  <body>
    <button id="list">List Tabs</button>
    <button id="save">Save Tabs</button>
    <button id="group">Group by Domain</button>

    <ul id="tabs"></ul>

    <script type="module">
      import { listTabs, saveTabsGroup, groupTabsByDomain } from "./popup.js";

      document.getElementById("list").onclick = listTabs;
      document.getElementById("save").onclick = saveTabsGroup;
      document.getElementById("group").onclick = groupTabsByDomain;
    </script>
  </body>
</html>
//ou can add fetures like searching, removing duplicates, grouping by domain,
and saving/restoring tab sessions. The extension can be built using HTML, CSS,
and JavaScript, leveraging the Chrome Extensions API to interact with browser
tabs.
